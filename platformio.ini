; Friendship Lamp — PlatformIO project config
;
; Build & upload:
;   pio run -t upload
;   pio device monitor
;
; Both lamps run this identical firmware. The ONLY difference between them
; is DEVICE_ID in src/config.h ("A" on one, "B" on the other).

[env:esp32dev]
platform      = espressif32@^6.9.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200
monitor_echo  = yes     ; show what you type (PING, STATUS...) — off by default
; 921600 failed on the first real board ("Unable to verify flash chip
; connection" right after the baud change). 460800 is the usual safe speed;
; drop to 115200 if uploads still fail.
upload_speed  = 460800

; Exit the serial monitor with Ctrl+C. esp32_exception_decoder turns a crash
; backtrace into real file/line numbers, which you WILL want.
monitor_filters =
    esp32_exception_decoder
    time

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.3
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.2.0
    tzapu/WiFiManager @ ^2.0.17

build_flags =
    -DCORE_DEBUG_LEVEL=1
